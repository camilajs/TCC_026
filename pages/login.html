<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - ATHENA</title>

    <link rel="stylesheet" href="login.css">

</head>

<body>

    <!-- Cabeçalho -->
    <header>

        <div id="logo">
            <img src="../images/logo.svg" alt="Logo ATHENA">
        </div>

        <a href="main.html" id="voltar">Voltar</a>

    </header>


    <!-- Área principal -->
    <main>

        <!-- Imagem da coruja -->
        <div id="login-image">

            <img src="../images/coruja-logo.jpeg" alt="Coruja ATHENA" id="coruja">

            <h2>ATHENA</h2>

            <p>
                Enxergue o que acontece no seu estoque.
            </p>

        </div>


        <!-- Área do login -->
        <div id="login-area">

            <div id="login-card">

                <h1>Entrar</h1>

                <p id="login-description">
                    Acesse o sistema para acompanhar o estoque.
                </p>


                <!-- Tipo de acesso -->
                <div class="input-group">

                    <label>Tipo de acesso</label>

                    <button type="button" id="administrador">
                        Administrador
                    </button>

                    <button type="button" id="funcionario">
                        Funcionário
                    </button>

                </div>


                <!-- E-mail -->
                <div class="input-group">

                    <label for="email">E-mail</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Digite seu e-mail">

                </div>


                <!-- Senha -->
                <div class="input-group">

                    <label for="senha">Senha</label>

                    <div id="senha-container">

                        <input
                            type="password"
                            id="senha"
                            placeholder="Digite sua senha">

                        <button
                            type="button"
                            id="mostrar-senha">
                            👁
                        </button>

                    </div>

                </div>


                <!-- Entrar -->
                <button type="button" id="entrar">
                    Entrar
                </button>

                <p id="mensagem"></p>

            </div>

        </div>

    </main>


    <script src="login.js"></script>

</body>

</html>
