<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>ATHENA</title>
</head>
<body>
    <header>
        <div id="logo">
            <img src="../images/logo.svg" alt="Logo" style="width: 100px; height: 80px;">
        </div>
        <div id="header-btn">
            <button>Menu</button>
            <button><span>Acessar sistema</span></button>
        </div>
    </header>
    <main id="main">
        <div id="initial-page">
            <div id="top">
                <div id="top-text">
                    <h2>Tenha total controle dos seus produtos!</h2>
                    <p>Acompanhe seu estoque com olhos de coruja. É fácil e eficiente.</p>
                    <button id="top-btn">Conhecer agora</button>
                </div>  
                <div id="top-image">
                    <h1>AQUI TERÁ UMA IMAGEM</h1>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
