
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/estoque.css">
    <link rel="stylesheet" href="../css/style.css">
    <title>Estoque</title>
</head>
<body>

    <div id="usuario-logado">
        <div id="identificacao">
            <span id="nome-usuario"></span>
            <span id="tipo-usuario"></span>
        </div>

        <button id="botao-sair" type="button">Sair</button>
    </div>
    
    <div id="menu">
        <button class="button-menu" id="ver-prod">Ver produtos</button>
        <button class="button-menu" id="add-prod">Adicionar produto</button>
    </div>

    <div id="tela-tabela">
        <div id="tela-r">
            <h3>Selecione um produto:</h3>
            <select name="sel-prod" id="s-prod">

            </select>
        </div>

        <table class="table">
            <thead>
                <tr>
                <th scope="col">Nome</th>
                <th scope="col">Quantidade</th>
                <th scope="col">Status</th>
                </tr>
            </thead>
            <tbody id="tbody">
            </tbody>
        </table>
    </div>

    <div id="tela-add">
        <h3>Adicionar produto</h3>
        <div id="form">
            <div>
                <label for="p-nome">Nome:</label>
                <input type="text" placeholder="Insira o nome do produto" id="input-nome">
            </div>
            <div>
                <label for="p-peso">Peso unitário:</label>
                <button id="btn-peso" onclick="guardarPeso();">Pesar</button>
                <p id="campo-peso"></p>
            </div>
        </div>
        <button id="enviar" onclick="guardarProduto();">Enviar</button>
    </div>



    <script src="../../api/arduino.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/estoque.js"></script>

</body>
</html>
